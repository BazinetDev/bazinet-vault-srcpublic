<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="referrer" content="no-referrer"/>
  <meta name="theme-color" content="#0f1320"/>
  <title>Survey — Bazinet</title>
  <link rel="icon" href="/favicon.svg"/>
  <script src="/i18n-strings.js"></script>
  <script src="/i18n.js"></script>
  <script src="/theme.js"></script>
  <script src="/notice.js"></script>
  <link rel="stylesheet" href="/styles.css"/>
  <link rel="stylesheet" href="/survey.css"/>
</head>
<body class="sv">
  <main class="sv-wrap">
    <header class="sv-brand">
      <svg viewBox="0 0 48 48" width="28" height="28" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c97ff"/><stop offset="1" stop-color="#4f6bf0"/></linearGradient></defs><path d="M24 3 6 10v12c0 11 7.7 18.6 18 23 10.3-4.4 18-12 18-23V10L24 3Z" fill="url(#lg)"/><path d="m16.5 24 5 5 10-10.5" fill="none" stroke="#0f1320" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="sv-name">Bazinet</span>
      <span class="sv-spacer"></span>
      <button class="lang-toggle" type="button" data-lang-toggle>FR</button>
    </header>
    <section id="sv-card" class="sv-card" aria-live="polite">
      <p id="sv-loading" class="muted" data-i18n="t.7ab94b08">Loading the survey…</p>
      <div id="sv-form" class="hidden"></div>
      <div id="sv-done" class="sv-done hidden">
        <h1 id="sv-done-title" class="svf-title"></h1>
        <p id="sv-done-text"></p>
        <button id="sv-edit" class="ghost-btn hidden" type="button" data-i18n="t.f596289f">Edit my answers</button>
      </div>
      <p id="sv-error" class="error hidden"></p>
    </section>
    <p class="muted small sv-foot">
      <span data-i18n="t.f74db5b7">This link is personal: it answers as your Bazinet account.</span>
      <button id="sv-optout" class="svf-link" type="button" data-i18n="t.750eb701">Stop receiving surveys</button>
    </p>
  </main>
  <script src="/dom.js"></script>
  <script src="/survey-form.js"></script>
  <script src="/survey.js"></script>
</body>
</html>
