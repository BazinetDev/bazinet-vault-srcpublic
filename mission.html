<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex"/>
  <meta name="theme-color" content="#0f1320"/>
  <title>Open a mission — Bazinet</title>
  <link rel="icon" href="/favicon.svg"/>
  <script src="/i18n-strings.js"></script>
  <script src="/i18n.js"></script>
  <script src="/theme.js"></script>
  <script src="/notice.js"></script>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body class="ms-page">
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="topbar-brand" aria-label="Bazinet home">
        <svg viewBox="0 0 48 48" width="26" height="26" aria-hidden="true"><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c97ff"/><stop offset="1" stop-color="#4f6bf0"/></linearGradient></defs><path d="M24 3 6 10v12c0 11 7.7 18.6 18 23 10.3-4.4 18-12 18-23V10L24 3Z" fill="url(#tg)"/><circle cx="24" cy="21" r="5" fill="#0f1320"/><rect x="21.6" y="23" width="4.8" height="8" rx="2.4" fill="#0f1320"/></svg>
        <span class="brand-text">Bazinet</span>
      </a>
      <nav class="topbar-nav">
        <a href="/support" class="nav-help" data-i18n-attr="aria-label:nav.support,title:nav.support" aria-label="Support" title="Support"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.9c0 1.7-2.4 2.2-2.4 3.6"/><path d="M12 17h.01"/></svg><span data-i18n="nav.support">Support</span></a>
        <button class="lang-toggle" type="button" data-lang-toggle>FR</button>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle light or dark mode" title="Toggle theme">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="ms-main">
    <section id="ms-open" class="card ms-card">
      <h1 class="ms-h" data-i18n="ms.title">Open a mission</h1>
      <p class="muted" data-i18n="ms.lede">Enter the mission code and its passcode. Nothing else from your account is needed or shown on this device.</p>
      <form id="ms-form" autocomplete="off" novalidate>
        <label><span data-i18n="ms.code">Mission code</span>
          <input id="ms-code" class="ms-code" inputmode="text" autocapitalize="characters" spellcheck="false" maxlength="14" placeholder="XXXX-XXXX-XXXX" required/>
        </label>
        <label><span data-i18n="ms.pass">Passcode</span>
          <input id="ms-pass" type="password" autocomplete="off" required/>
        </label>
        <button id="ms-go" class="primary" type="submit" data-i18n="ms.go">Open mission</button>
        <p id="ms-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="ms-kit" class="ms-kit hidden">
      <div class="ms-bar">
        <div class="ms-bar-txt">
          <strong id="ms-name"></strong>
          <span id="ms-ends" class="muted small"></span>
        </div>
        <button id="ms-close" class="ghost small" type="button" data-i18n="ms.close">Close mission</button>
      </div>
      <input id="ms-filter" class="ms-filter" type="search" autocomplete="off" data-i18n-attr="placeholder:ms.search" placeholder="Search"/>
      <ul id="ms-items" class="items ms-items"></ul>
      <p class="muted small ms-note" data-i18n="ms.autoclose">Closes by itself after 5 minutes without use, and when the mission ends.</p>
    </section>
  </main>

  <script src="/dom.js"></script>
  <script src="/hash-wasm-argon2.js"></script>
  <script src="/crypto.js"></script>
  <script src="/totp.js"></script>
  <script src="/mission-code.js"></script>
  <script src="/mission.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onMissionTurnstile&render=explicit" async defer="defer"></script>
  <div id="ts-overlay" class="ts-overlay">
    <div class="ts-card">
      <p class="ts-cap" data-i18n="t.4a6ddb69">Quick security check</p>
      <p class="ts-sub" data-i18n="t.1a05f99d">Confirm you're human to continue.</p>
      <div id="ts-mission"></div>
    </div>
  </div>
</body>
</html>
